# Claim -> evidence contract (lab protocol §15, §26).
# A claim with no experiment is prohibited; an experiment supporting no claim is removed.
# Status values: HYPOTHESIZED | SUPPORTED | REFUTED | WITHDRAWN. Nothing has been run on real systems.
#
# REVISION 2026-09-27 (after adversarial review, PROPOSAL.md §18–21):
#   v1 (method paper: population-relational shield) is KILLED as an ML-venue contribution.
#   v2 (scope × feedback × scale study) is MODIFY, gated by G1–G5; no method code before G4.

v2:
  S1:
    claim: >
      For relational infrastructure changes (PQ migration), LLM-agent harm (SPRR, entity-level
      outages) depends on verifier quantifier scope {artifact, single-peer, expert probe set,
      telemetry population} more than on model capability (>= 6 models across scales), at
      non-inferior PQ coverage.
    experiments: [E1, E5]
    gates: [G3, G4]
    status: HYPOTHESIZED
  S2:
    claim: >
      Relational counterexample feedback (class, old negotiated alg, new negotiated alg) redirects
      agent plans toward PQ-preserving changes, whereas pass/fail feedback does not (reconciling
      CodAg's null result with Asadli et al. 2026).
    experiments: [E7, E8]
    gates: [G2, G4]
    status: HYPOTHESIZED
  S3:
    claim: >
      Among real agent-produced crypto-config edits that regress PQ delivery, non-removal edits
      (demotion, composition — where a removal-only log rule is blind) are a non-negligible share (>= 5%).
    experiments: [G3-pilot]
    status: SUPPORTED_ON_HAN_DATA   # 211/375 = 56.3% [51.2, 61.2] non-removal (research/gates/g3_han_episodes.out);
                                    # external validity limited to Han's ticket families
  S5:
    claim: >
      Verifier-scope effect is protocol-dependent: ≈0 beyond a stock-client pin on TLS (one hybrid
      family), positive on SSH (incomparable NTRU-Prime-only / ML-KEM-only classes).
    experiments: [G4, E6]
    status: HYPOTHESIZED   # TLS half consistent with Han data: stock pin recall 375/375
  S4:
    claim: >
      Real client populations contain incomparable minimal PQ capability classes beyond SSH, and
      entity-level unseen mass materially exceeds traffic-weighted unseen mass.
    experiments: [G5-measurement, E4]
    status: HYPOTHESIZED   # L6b is consistent (abstract simulation only)

v1_method_claims:   # retained for audit trail
  C1: {claim: "shield reduces SPRR/OWE vs baselines", status: WITHDRAWN, reason: "W1 — equals AWS-style log rule on removals"}
  C2: {claim: "mechanism = relational recall", status: WITHDRAWN, reason: "W6/Q18 — true by construction on observed classes"}
  C3: {claim: "missing-mass certificate calibrated", status: WITHDRAWN, reason: "W4 — traffic- not entity-level; prior art STADS/Blind-Spot Mass"}
  P2: {claim: "PQ-dominant widening preserves PQ", status: REFUTED, evidence: "verify_lemmas L3b (SSH), L3c (TLS no-HRR)"}

theory_checks:   # OBSERVED on small abstract instances only (research/analysis/verify_lemmas.out)
  P1: "product condition == all-interleavings availability (L1, L2: 0 mismatches) — engineering lemma"
  P5: "min proxies == min vertex cover of G[S] (L4, n<=6); multicast => hypergraph VC (NP-hard)"
  L5: "incomparable-class example: single-peer probes each miss one withdrawal (by construction)"
  L6b: "heavy-tail entity-clustered: traffic bound covers but loose; entity-unseen ≈ 1.6–6× traffic-unseen"
